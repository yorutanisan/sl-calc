name: ランキング更新と公開

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 0-6 * * 1-5"   # 平日 9:00〜15:50（日本時間）に10分おき。GitHub の都合で数分〜十数分遅れることがある
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 出来高ランキングを取得
        id: rank
        if: github.event_name != 'push'
        run: |
          pip install -q -r scripts/requirements.txt
          python scripts/update_ranking.py
          git add -A ranking.json tech
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "ランキングとテクニカルを更新"
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 公開するかどうか
        id: flag
        run: echo "deploy=${{ github.event_name == 'push' || steps.rank.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: 公開するファイルをまとめる
        if: steps.flag.outputs.deploy == 'true'
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js ranking.json tech icon-*.png .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.flag.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
